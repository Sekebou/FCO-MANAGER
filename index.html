    <style>
      /* Inline loading screen — prevents black flash on native app first launch */
      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #0f1a3e 0%, #1a2e6b 50%, #253d8a 100%);
        transition: opacity 0.4s ease;
      }
      #app-loader.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      #app-loader img {
        width: 96px;
        height: 96px;
        border-radius: 24px;
        animation: logo-pulse 1.8s ease-in-out infinite;
      }
      #app-loader .loader-text {
        margin-top: 20px;
        color: rgba(255,255,255,0.8);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.5px;
      }
      #app-loader .loader-dots {
        display: flex;
        gap: 6px;
        margin-top: 16px;
      }
      #app-loader .loader-dots span {
        width: 8px;
        height: 8px;
        background: rgba(255,255,255,0.6);
        border-radius: 50%;
        animation: dot-bounce 1.4s ease-in-out infinite;
      }
      #app-loader .loader-dots span:nth-child(2) { animation-delay: 0.2s; }
      #app-loader .loader-dots span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes logo-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.85; }
      }
      @keyframes dot-bounce {
        0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
        40% { transform: scale(1); opacity: 1; }
      }
    </style>
  </head>

  <body>
    <div id="app-loader">
      <img src="/logo.png" alt="FCO" />
      <div class="loader-text">Chargement…</div>
      <div class="loader-dots">
        <span></span><span></span><span></span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
